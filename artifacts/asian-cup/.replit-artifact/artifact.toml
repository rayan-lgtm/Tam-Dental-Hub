kind = "web"
previewPath = "/"
title = "TAM Dental Asian Cup Predictions"
version = "1.0.0"
id = "artifacts/asian-cup"

[[services]]
localPort = 8082
name = "Asian Cup Predictions"
paths = ["/"]

[services.env]
PORT = "8082"
BASE_PATH = "/"

[services.development]
run = "pnpm --filter @workspace/asian-cup run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/asian-cup", "run", "build"]
run = ["pnpm", "--filter", "@workspace/asian-cup", "run", "serve"]
